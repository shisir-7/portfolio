<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="warmStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE7DE" />
      <stop offset="100%" stop-color="#DCD6C8" />
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="16" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Environment Background -->
  <rect width="1200" height="800" fill="#E2DDD2"/>

  <!-- Top Metadata -->
  <text x="80" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#756E63" letter-spacing="2">FORMA / EDITORIAL PUBLICATION &amp; BRAND IDENTITY</text>
  <text x="1120" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#BD3A1B" letter-spacing="1" text-anchor="end">HARDCOVER EDITION 01</text>

  <!-- Hardcover Book Mockup Presentation -->
  <g transform="translate(180, 110)" filter="url(#bookShadow)">
    <!-- Book Cover Canvas -->
    <rect x="0" y="0" width="460" height="580" rx="4" fill="#F7F5EE" stroke="#DDD6C7" stroke-width="1.5"/>
    
    <!-- Spine Emboss Effect -->
    <rect x="0" y="0" width="28" height="580" rx="2" fill="#E8E4DA"/>
    <line x1="28" y1="0" x2="28" y2="580" stroke="#C9C2B2" stroke-width="1"/>

    <!-- Cover Typographic Composition -->
    <g transform="translate(65, 70)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#787265" letter-spacing="3">MONOGRAPH SERIES / VOL. 1</text>
      
      <!-- Architectural Graphic Line Geometry -->
      <line x1="0" y1="45" x2="330" y2="45" stroke="#141413" stroke-width="1.5"/>
      
      <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="64" fill="#141413" letter-spacing="-2">FORMA</text>
      <text x="0" y="180" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="26" fill="#BD3A1B">Spaces of Silence &amp; Mass</text>

      <!-- Geometry Cutout Illusion -->
      <g transform="translate(0, 220)">
        <rect x="0" y="0" width="160" height="190" fill="#141413"/>
        <circle cx="80" cy="95" r="55" fill="#F7F5EE"/>
        <rect x="180" y="0" width="150" height="190" fill="#E4DDCF"/>
        <line x1="200" y1="30" x2="310" y2="160" stroke="#BD3A1B" stroke-width="2"/>
        <line x1="310" y1="30" x2="200" y2="160" stroke="#141413" stroke-width="1.5"/>
      </g>

      <!-- Blind Deboss Label -->
      <text x="0" y="470" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#888173" letter-spacing="1.5">SHISIR ACHARYA / ARCHITECTURAL IDENTITY</text>
    </g>
  </g>

  <!-- Open Page Spread Beside It -->
  <g transform="translate(680, 110)" filter="url(#bookShadow)">
    <rect x="0" y="0" width="400" height="580" rx="4" fill="#FCFAF6" stroke="#DDD6C7" stroke-width="1.5"/>
    <g transform="translate(45, 60)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#888173">PAGE 042 // THE VOID</text>
      <rect x="0" y="45" width="310" height="240" fill="#EFEAE0"/>
      <!-- Minimal Architectural Elevation sketch -->
      <path d="M 30 250 L 30 140 L 150 140 L 150 80 L 280 80 L 280 250 Z" fill="#141413"/>
      <rect x="60" y="170" width="40" height="80" fill="#FCFAF6"/>
      <rect x="180" y="110" width="60" height="140" fill="#BD3A1B"/>

      <!-- Editorial Paragraph -->
      <text x="0" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#141413">Structure and Negative Space</text>
      <text x="0" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#666157" line-height="1.5">
        <tspan x="0" dy="0">Architecture begins where material ceases. By</tspan>
        <tspan x="0" dy="18">carving intentional voids into concrete bodies,</tspan>
        <tspan x="0" dy="18">light becomes an active structural participant.</tspan>
      </text>

      <text x="0" y="475" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="16" fill="#BD3A1B">“The quietest space is always the loudest memory.”</text>
    </g>
  </g>

  <!-- Bottom Stamp -->
  <text x="600" y="745" font-family="'JetBrains Mono', monospace" font-size="11" fill="#756E63" text-anchor="middle" letter-spacing="2">BOOK DESIGN, PRINT CURATION &amp; BRAND SYSTEMS / SHISIR ACHARYA</text>
</svg>
