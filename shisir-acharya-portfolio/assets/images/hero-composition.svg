<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="editorialTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#E7E2D7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="900" rx="8" fill="url(#editorialTone)" stroke="#DCD6C8" stroke-width="1.5"/>

  <!-- Subtle Editorial Technical Coordinates & Grid -->
  <g stroke="#CFC8B8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="60" x2="740" y2="60"/>
    <line x1="60" y1="840" x2="740" y2="840"/>
    <line x1="60" y1="60" x2="60" y2="840"/>
    <line x1="740" y1="60" x2="740" y2="840"/>
    <line x1="400" y1="60" x2="400" y2="840"/>
  </g>

  <!-- Technical Marks and Typography -->
  <text x="80" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#756E63" letter-spacing="2">STUDIO ARCHIVE // 2026</text>
  <text x="720" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BD3A1B" letter-spacing="1" text-anchor="end">KAPILVASTU · NP (27.55° N, 83.05° E)</text>

  <!-- Geometric Abstract Form of the Three Disciplines:
       1. The Interface Window (UI/UX)
       2. The Film Pacing Ratio (Video Editing)
       3. The Swiss Typographic Angle (Graphic Design)
  -->
  <g transform="translate(140, 160)">
    <!-- Base Layer: Graphic Design Poster Grid Cut -->
    <rect x="0" y="60" width="380" height="480" fill="#141413" rx="2"/>
    
    <!-- Vermilion Angle Cut (Graphic Design) -->
    <polygon points="120,60 380,60 380,320" fill="#BD3A1B"/>
    
    <!-- Interface Grid (UI/UX) -->
    <g transform="translate(40, 100)" stroke="#F7F5F0" stroke-width="1" opacity="0.3">
      <rect x="0" y="0" width="220" height="150" fill="none"/>
      <line x1="0" y1="30" x2="220" y2="30"/>
      <line x1="70" y1="30" x2="70" y2="150"/>
      <circle cx="15" cy="15" r="3" fill="#F7F5F0"/>
      <circle cx="30" cy="15" r="3" fill="#F7F5F0"/>
    </g>

    <!-- Kinetic Film Shutter Frame (Video Editing) -->
    <g transform="translate(140, 290)">
      <rect x="0" y="0" width="340" height="220" rx="4" fill="#FBF9F5" stroke="#141413" stroke-width="2"/>
      
      <!-- Filmstrip holes on left and right -->
      <g fill="#141413">
        <rect x="12" y="20" width="14" height="20" rx="2"/>
        <rect x="12" y="55" width="14" height="20" rx="2"/>
        <rect x="12" y="90" width="14" height="20" rx="2"/>
        <rect x="12" y="125" width="14" height="20" rx="2"/>
        <rect x="12" y="160" width="14" height="20" rx="2"/>

        <rect x="314" y="20" width="14" height="20" rx="2"/>
        <rect x="314" y="55" width="14" height="20" rx="2"/>
        <rect x="314" y="90" width="14" height="20" rx="2"/>
        <rect x="314" y="125" width="14" height="20" rx="2"/>
        <rect x="314" y="160" width="14" height="20" rx="2"/>
      </g>

      <!-- Center Typography inside Film Frame -->
      <text x="170" y="95" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="34" fill="#141413" text-anchor="middle">Form · Rhythm</text>
      <text x="170" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#BD3A1B" text-anchor="middle" letter-spacing="3">&amp; PURPOSE</text>
      
      <line x1="70" y1="160" x2="270" y2="160" stroke="#DDD6C7" stroke-width="1"/>
      <text x="170" y="180" font-family="'JetBrains Mono', monospace" font-size="10" fill="#756E63" text-anchor="middle">TRI-DISCIPLINARY PRACTICE</text>
    </g>
  </g>

  <!-- Bottom Editorial Details -->
  <g transform="translate(80, 720)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#141413">DISCIPLINES IN HARMONY</text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B655B">01 UI/UX &amp; Interaction Design</text>
    <text x="0" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B655B">02 Narrative Video Editing &amp; Rhythm</text>
    <text x="0" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6B655B">03 Swiss Typography &amp; Visual Systems</text>

    <!-- Monogram Seal -->
    <circle cx="590" cy="45" r="38" fill="none" stroke="#141413" stroke-width="1.5"/>
    <circle cx="590" cy="45" r="34" fill="none" stroke="#BD3A1B" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="590" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#141413" text-anchor="middle">SA</text>
    <text x="590" y="98" font-family="'JetBrains Mono', monospace" font-size="9" fill="#756E63" text-anchor="middle">AUTHENTIC ARTIFACT</text>
  </g>
</svg>
