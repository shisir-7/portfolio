<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE2"/>
      <stop offset="100%" stop-color="#E2DDD2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" rx="4" fill="url(#avatarTone)" stroke="#D4CBBF" stroke-width="1.5"/>

  <!-- Minimal Corner Marks -->
  <g stroke="#141413" stroke-width="1.5">
    <path d="M 30 50 L 30 30 L 50 30" fill="none"/>
    <path d="M 570 50 L 570 30 L 550 30" fill="none"/>
    <path d="M 30 650 L 30 670 L 50 670" fill="none"/>
    <path d="M 570 650 L 570 670 L 550 670" fill="none"/>
  </g>

  <!-- Inner Architectural Composition -->
  <g transform="translate(60, 60)">
    <text x="0" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#787166" letter-spacing="2">SHISIR ACHARYA / BIOGRAPHY EMBLEM</text>
    <text x="480" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BD3A1B" text-anchor="end">EST. 2024</text>

    <!-- Large Monogram Composition -->
    <rect x="0" y="55" width="480" height="460" fill="#141413"/>
    
    <!-- Fine geometric grid over black card -->
    <g stroke="#262522" stroke-width="1">
      <line x1="120" y1="55" x2="120" y2="515"/>
      <line x1="240" y1="55" x2="240" y2="515"/>
      <line x1="360" y1="55" x2="360" y2="515"/>
      <line x1="0" y1="170" x2="480" y2="170"/>
      <line x1="0" y1="285" x2="480" y2="285"/>
      <line x1="0" y1="400" x2="480" y2="400"/>
    </g>

    <text x="240" y="240" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="110" fill="#FBF9F5" text-anchor="middle" letter-spacing="-4">S·A</text>
    <text x="240" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#BD3A1B" text-anchor="middle" letter-spacing="4">KAPILVASTU · NEPAL</text>
    
    <text x="240" y="370" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8C857B" text-anchor="middle" line-height="1.6">
      <tspan x="240" dy="0">+2 MANAGEMENT / COMPUTER SCIENCE</tspan>
      <tspan x="240" dy="22">UI/UX · VIDEO EDITING · GRAPHIC DESIGN</tspan>
    </text>

    <!-- Base Details below card -->
    <g transform="translate(0, 545)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#141413">DISCIPLINE PHILOSOPHY</text>
      <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#666157">Combining analytical logic with aesthetic clarity.</text>
    </g>
  </g>
</svg>
