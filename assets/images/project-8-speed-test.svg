    <path d="M636 606C676 600 690 556 722 574C752 590 764 528 796 552C826 574 840 516 872 536C900 554 916 498 948 522C978 544 992 490 1024 512C1052 532 1066 476 1098 500C1128 522 1142 466 1174 488C1200 506 1214 458 1244 476C1268 490 1282 456 1300 462C1322 468 1340 448 1390 452" stroke="#BD3A1B" stroke-width="4" stroke-linecap="round"/>
    <path d="M636 606C676 600 690 556 722 574C752 590 764 528 796 552C826 574 840 516 872 536C900 554 916 498 948 522C978 544 992 490 1024 512C1052 532 1066 476 1098 500C1128 522 1142 466 1174 488C1200 506 1214 458 1244 476C1268 490 1282 456 1300 462C1322 468 1340 448 1390 452V640H636Z" fill="#BD3A1B" fill-opacity=".08"/>
    <circle cx="1390" cy="452" r="7" fill="#BD3A1B"/>
    <path d="M612 660H1415" stroke="#DCD6C9" stroke-width="2"/>
    <text x="612" y="692" fill="#8D887E" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">PEAK 312 Mbps</text>
