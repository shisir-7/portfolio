      <path d="M442 82l3 3 5.5-6" stroke="#F7F5F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="470" y="87" fill="#C4BFB3" font-family="Arial, sans-serif" font-size="14" font-weight="600">UPLOAD</text>
      <line x1="560" y1="82" x2="616" y2="82" stroke="#4B4A43" stroke-width="2"/>
      <circle cx="646" cy="82" r="9" fill="#4B4A43"/>
      <text x="670" y="87" fill="#777267" font-family="Arial, sans-serif" font-size="14" font-weight="600">RESULTS</text>
