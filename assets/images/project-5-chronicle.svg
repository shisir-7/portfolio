  <g transform="translate(348 858)">
    <rect width="904" height="116" rx="18" fill="#242421" stroke="#fff" stroke-opacity=".12"/>
    <text x="44" y="46" fill="#8E897F" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DELIVERABLE CUTS</text>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">
      <rect x="44" y="66" width="192" height="30" rx="6" fill="#BD3A1B"/>
      <text x="140" y="87" fill="#F7F5F0">16:9 MASTER</text>
      <rect x="248" y="66" width="192" height="30" rx="6" fill="#393934" stroke="#5A5952"/>
      <text x="344" y="87" fill="#C4BFB3">9:16 REELS x3</text>
      <rect x="452" y="66" width="192" height="30" rx="6" fill="#393934" stroke="#5A5952"/>
