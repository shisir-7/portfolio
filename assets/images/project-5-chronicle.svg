  <path d="M0 824H1600" stroke="#fff" stroke-opacity=".08"/>
  <text x="112" y="113" fill="#B8B3A8" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4">RHYTHM / IMPACT / TITLE</text>
  <text x="1484" y="113" fill="#8E897F" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" text-anchor="end">CHRONICLE  —  05</text>

  <g filter="url(#shadow)">
    <rect x="142" y="154" width="1316" height="670" rx="20" fill="#121214"/>
    <path d="M162 154H1438C1449.05 154 1458 162.954 1458 174V228H142V174C142 162.954 150.954 154 162 154Z" fill="#1B1B1E"/>
    <circle cx="179" cy="191" r="6" fill="#BD3A1B"/>
    <circle cx="201" cy="191" r="6" fill="#D7C7AA"/>
    <circle cx="223" cy="191" r="6" fill="#C4BFB3"/>
    <text x="800" y="198" fill="#767168" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">KINETIC BRAND REEL / 60 SECONDS</text>
    <rect x="1250" y="176" width="176" height="32" rx="16" fill="#242427"/>
    <circle cx="1270" cy="192" r="4" fill="#BD3A1B"/>
    <text x="1284" y="197" fill="#B8B3A8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">BRAND FILM</text>

    <!-- Hero frame -->
    <rect x="206" y="262" width="1209" height="278" rx="12" fill="#0C0A0E" stroke="#2D2636" stroke-width="1.5"/>
    <path d="M226 282L506 540L426 540L146 282Z" fill="url(#speedRamp)" opacity=".18"/>
    <g stroke="#F4F1F7" stroke-width="1" opacity=".28">
      <line x1="286" y1="400" x2="326" y2="400"/>
      <line x1="1295" y1="400" x2="1335" y2="400"/>
      <circle cx="810" cy="400" r="104" fill="none" stroke-dasharray="4 8"/>
    </g>
    <text x="810" y="392" fill="#F4F1F7" font-family="Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-3" text-anchor="middle">MOMENTUM</text>
    <text x="810" y="440" fill="#BD3A1B" font-family="Georgia, serif" font-style="italic" font-size="28" text-anchor="middle">and the physics of human attention.</text>
    <rect x="238" y="486" width="196" height="30" rx="4" fill="#1C1824" stroke="#362E44"/>
    <text x="254" y="506" fill="#C5BBD6" font-family="Courier New, monospace" font-size="12">SPEED RAMP 300% &gt; 100%</text>
    <text x="1383" y="506" fill="#A79BBF" font-family="Courier New, monospace" font-size="12" text-anchor="end">SYNCED TRANSIENT 128 BPM</text>

