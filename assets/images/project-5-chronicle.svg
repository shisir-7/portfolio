<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="chronicleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="50%" stop-color="#1A1520" />
      <stop offset="100%" stop-color="#0E0C12" />
    </linearGradient>
    <linearGradient id="splitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BD3A1B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#chronicleBg)"/>

  <!-- Top Metadata -->
  <text x="80" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7E758C" letter-spacing="2">CHRONICLE / MOTION REEL / KINETIC PACING</text>
  <text x="1120" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2847A" letter-spacing="1" text-anchor="end">60 FPS EDITORIAL CUT</text>

  <!-- Kinetic Title Sequence Showcase (Film Frames Collage) -->
  <g transform="translate(100, 110)">
    <!-- Main Center Hero Cut -->
    <rect x="0" y="0" width="1000" height="420" rx="8" fill="#0C0A0E" stroke="#2D2636" stroke-width="1.5"/>

    <!-- Kinetic Typography Graphic in Film Frame -->
    <text x="500" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="88" fill="#F4F1F7" text-anchor="middle" letter-spacing="-3">MOMENTUM</text>
    <text x="500" y="245" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="34" fill="#BD3A1B" text-anchor="middle" letter-spacing="1">and the physics of human attention.</text>

    <!-- Chromatic Abberation / Light Leak Accent -->
    <path d="M 120 40 L 400 420 L 320 420 L 40 40 Z" fill="url(#splitGradient)" opacity="0.18"/>
    
    <!-- Framing Guides -->
    <g stroke="#F4F1F7" stroke-width="1" opacity="0.3">
      <line x1="80" y1="210" x2="120" y2="210"/>
      <line x1="880" y1="210" x2="920" y2="210"/>
      <circle cx="500" cy="210" r="160" fill="none" stroke-dasharray="4 6"/>
    </g>

    <!-- Lower Title Tag -->
    <rect x="40" y="360" width="180" height="28" rx="4" fill="#1C1824" stroke="#362E44"/>
    <text x="55" y="378" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C5BBD6">SPEED RAMP: 300% &gt; 100%</text>

    <text x="960" y="378" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A79BBF" text-anchor="end">SYNCED TRANSIENT BEAT 128BPM</text>
  </g>

  <!-- 3-Way Filmstrip Contact Sheet below -->
  <g transform="translate(100, 560)">
    <!-- Frame 1 -->
    <rect x="0" y="0" width="310" height="150" rx="6" fill="#17131D" stroke="#2B2336" stroke-width="1"/>
    <rect x="15" y="15" width="280" height="85" fill="#201A29"/>
    <text x="155" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8C809E" text-anchor="middle">FRAME A / IMPACT CUT</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#C5BBD6">TC: 00:01:14:02</text>
    <text x="290" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BD3A1B" text-anchor="end">FLASH DISPLACE</text>

    <!-- Frame 2 -->
    <rect x="345" y="0" width="310" height="150" rx="6" fill="#17131D" stroke="#2B2336" stroke-width="1"/>
    <rect x="360" y="15" width="280" height="85" fill="#201A29"/>
    <text x="500" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8C809E" text-anchor="middle">FRAME B / MATCH CUT</text>
    <text x="365" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#C5BBD6">TC: 00:01:14:18</text>
    <text x="635" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BD3A1B" text-anchor="end">AXIAL ZOOM</text>

    <!-- Frame 3 -->
    <rect x="690" y="0" width="310" height="150" rx="6" fill="#17131D" stroke="#2B2336" stroke-width="1"/>
    <rect x="705" y="15" width="280" height="85" fill="#201A29"/>
    <text x="845" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8C809E" text-anchor="middle">FRAME C / TYPO DROP</text>
    <text x="710" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#C5BBD6">TC: 00:01:15:06</text>
    <text x="980" y="125" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BD3A1B" text-anchor="end">MOTION BLUR</text>
  </g>

  <!-- Bottom Stamp -->
  <text x="600" y="745" font-family="'JetBrains Mono', monospace" font-size="11" fill="#756985" text-anchor="middle" letter-spacing="2">MOTION EDITING &amp; SOUND DESIGN SYNCHRONIZATION / SHISIR ACHARYA</text>
</svg>
