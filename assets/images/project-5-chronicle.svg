      <text x="222" y="718" fill="#C5BBD6" font-family="Courier New, monospace" font-size="13">TC 00:01:14:02</text>
      <text x="577" y="718" fill="#BD3A1B" font-family="Courier New, monospace" font-size="13" text-anchor="end">FLASH</text>
    </g>
    <g>
      <rect x="617" y="608" width="387" height="128" rx="10" fill="#17131D" stroke="#2B2336"/>
      <rect x="633" y="624" width="355" height="66" fill="#201A29"/>
      <text x="810" y="662" fill="#8C809E" font-family="Courier New, monospace" font-size="13" text-anchor="middle">FRAME B / MATCH CUT</text>
      <text x="633" y="718" fill="#C5BBD6" font-family="Courier New, monospace" font-size="13">TC 00:01:14:18</text>
      <text x="988" y="718" fill="#BD3A1B" font-family="Courier New, monospace" font-size="13" text-anchor="end">AXIAL ZOOM</text>
    </g>
    <g>
      <rect x="1028" y="608" width="387" height="128" rx="10" fill="#17131D" stroke="#2B2336"/>
      <rect x="1044" y="624" width="355" height="66" fill="#201A29"/>
      <text x="1221" y="662" fill="#8C809E" font-family="Courier New, monospace" font-size="13" text-anchor="middle">FRAME C / TYPO DROP</text>
      <text x="1044" y="718" fill="#C5BBD6" font-family="Courier New, monospace" font-size="13">TC 00:01:15:06</text>
      <text x="1399" y="718" fill="#BD3A1B" font-family="Courier New, monospace" font-size="13" text-anchor="end">MOTION BLUR</text>
    </g>
