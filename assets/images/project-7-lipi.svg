<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="lipiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151513" />
      <stop offset="100%" stop-color="#0E0E0D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#lipiBg)"/>

  <!-- Subtle Typographic Grid -->
  <g stroke="#262623" stroke-width="1" stroke-dasharray="2 4" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="880" y1="0" x2="880" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
  </g>

  <!-- Metadata corner stamps -->
  <text x="100" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71716A" letter-spacing="2">SYS.LIPI / BILINGUAL LOCALIZATION &amp; TYPOGRAPHY ENGINE</text>
  <text x="1100" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#BD3A1B" letter-spacing="1" text-anchor="end">LOCALE: EN ⇄ NP (नेपाली)</text>

  <!-- Main System UI Showcase Window -->
  <g filter="url(#softShadow)" transform="translate(100, 110)">
    <rect x="0" y="0" width="1000" height="570" rx="8" fill="#141413" stroke="#2C2C28" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect x="0" y="0" width="1000" height="46" rx="8" fill="#1C1C1A"/>
    <rect x="0" y="36" width="1000" height="10" fill="#1C1C1A"/>
    <circle cx="28" cy="23" r="4.5" fill="#3D3D38"/>
    <circle cx="44" cy="23" r="4.5" fill="#3D3D38"/>
    <circle cx="60" cy="23" r="4.5" fill="#3D3D38"/>
    <text x="500" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888680" font-weight="500" text-anchor="middle">lipi-engine.shisir.design / adaptive-locale-matrix</text>

    <!-- Two-Panel Specimen Split -->
    <!-- Left: Latin Script & Font Engine Matrix -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="440" height="450" rx="6" fill="#1B1B19" stroke="#2B2B27" stroke-width="1"/>
      
      <!-- Panel Header -->
      <text x="24" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BD3A1B" letter-spacing="1.5">01 / LATIN SPECIMEN</text>
      <text x="416" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71716A" text-anchor="end">Plus Jakarta Sans</text>
      
      <line x1="24" y1="52" x2="416" y2="52" stroke="#292925" stroke-width="1"/>

      <!-- Large Type Sample -->
      <text x="24" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#F7F5F0" letter-spacing="-1.5">Structure.</text>
      <text x="24" y="150" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="24" fill="#C9C4B7">The cadence of thought</text>

      <text x="24" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#8E8B82" line-height="1.5">
        <tspan x="24" dy="0">Real-time typographic switching dynamically</tspan>
        <tspan x="24" dy="19">re-calculates line heights, tracking, and optical</tspan>
        <tspan x="24" dy="19">rhythm without triggering visual reflow.</tspan>
      </text>

      <!-- Font Switcher Control Pill Representation -->
      <g transform="translate(24, 260)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6861" letter-spacing="1">LIVE FONT MODES</text>
        
        <rect x="0" y="15" width="120" height="34" rx="4" fill="#BD3A1B"/>
        <text x="60" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Editorial Serif</text>

        <rect x="130" y="15" width="120" height="34" rx="4" fill="#242421" stroke="#363632"/>
        <text x="190" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#A8A59D" text-anchor="middle">Swiss Sans</text>

        <rect x="260" y="15" width="120" height="34" rx="4" fill="#242421" stroke="#363632"/>
        <text x="320" y="37" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8A59D" text-anchor="middle">Technical Mono</text>
      </g>

      <!-- Micro Specs -->
      <g transform="translate(24, 370)">
        <rect x="0" y="0" width="392" height="55" rx="4" fill="#141413" stroke="#242421"/>
        <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#78756E">BASELINE GRID: 4px / 8px</text>
        <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BD3A1B">LATENCY: 0.8ms ZERO-FLICKER PERSISTENCE</text>
      </g>
    </g>

    <!-- Right: Devanagari Script & Locale Architecture -->
    <g transform="translate(520, 75)">
      <rect x="0" y="0" width="440" height="450" rx="6" fill="#1B1B19" stroke="#2B2B27" stroke-width="1"/>
      
      <!-- Panel Header -->
      <text x="24" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BD3A1B" letter-spacing="1.5">02 / DEVANAGARI SPECIMEN</text>
      <text x="416" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71716A" text-anchor="end">नेपाली लिपि संरचना</text>
      
      <line x1="24" y1="52" x2="416" y2="52" stroke="#292925" stroke-width="1"/>

      <!-- Large Devanagari Sample -->
      <text x="24" y="120" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="46" fill="#F7F5F0">रचनात्मकता।</text>
      <text x="24" y="155" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="22" fill="#C9C4B7">विचार र भावनाको सङ्गम</text>

      <text x="24" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" fill="#8E8B82" line-height="1.6">
        <tspan x="24" dy="0">नेपाली भाषा र देवनागरी लिपिलाई अन्तर्राष्ट्रिय</tspan>
        <tspan x="24" dy="21">डिजाइन मापदण्डसँग संयोजन गर्दै सहज, सुपाठ्य र</tspan>
        <tspan x="24" dy="21">आकर्षक प्रयोगकर्ता अनुभव निर्माण गरिएको छ।</tspan>
      </text>

      <!-- Locale Switcher Pill Representation -->
      <g transform="translate(24, 260)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6B6861" letter-spacing="1">BILINGUAL LOCALE SWITCH</text>
        
        <rect x="0" y="15" width="180" height="34" rx="4" fill="#242421" stroke="#363632"/>
        <circle cx="20" cy="32" r="4" fill="#71716A"/>
        <text x="35" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#A8A59D">English (EN)</text>

        <rect x="195" y="15" width="185" height="34" rx="4" fill="#291C18" stroke="#BD3A1B"/>
        <circle cx="215" cy="32" r="4" fill="#BD3A1B"/>
        <text x="230" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F7F5F0">नेपाली (NP)</text>
      </g>

      <!-- Cultural Origin & Shirorekha Alignment -->
      <g transform="translate(24, 370)">
        <rect x="0" y="0" width="392" height="55" rx="4" fill="#141413" stroke="#242421"/>
        <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#78756E">ORIGIN: KAPILVASTU, NEPAL (UTC+5:45)</text>
        <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BD3A1B">MATRA &amp; SHIROREKHA OPTICAL BALANCING</text>
      </g>
    </g>
  </g>

  <!-- Bottom Stamp -->
  <text x="600" y="745" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5E5C56" text-anchor="middle" letter-spacing="2">INTEGRATED DIRECTLY INTO SHISIR ACHARYA PORTFOLIO / 2026</text>
</svg>
