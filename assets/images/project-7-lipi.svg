<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP&family=Noto+Naskh+Arabic&family=Noto+Sans+Devanagari&display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#EDE9E1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>

  <!-- Grid lines (editorial structure) -->
  <line x1="0" y1="64" x2="800" y2="64" stroke="#DCD6C9" stroke-width="1"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#DCD6C9" stroke-width="1"/>
  <line x1="480" y1="64" x2="480" y2="500" stroke="#DCD6C9" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="64" fill="#121211"/>
  <text x="32" y="39" font-family="'JetBrains Mono',monospace" font-size="11" fill="#DCD6C9" letter-spacing="3">PROJECT 07 — LIPI</text>
  <rect x="600" y="18" width="168" height="28" rx="4" fill="#BD3A1B"/>
  <text x="684" y="36" font-family="'JetBrains Mono',monospace" font-size="10" fill="#F7F5F0" letter-spacing="2" text-anchor="middle">LIVE FEATURE</text>

  <!-- Main label -->
  <text x="32" y="112" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="42" fill="#121211" letter-spacing="-1">Lipi</text>
  <text x="32" y="138" font-family="'Plus Jakarta Sans',sans-serif" font-weight="300" font-size="14" fill="#6B6560" letter-spacing="0.5">Multi-Language · Multi-Font · Live Portfolio Engine</text>

  <!-- Language specimens grid (left panel) -->
  <!-- English -->
  <text x="32" y="186" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" fill="#BD3A1B" letter-spacing="2">EN</text>
  <text x="60" y="186" font-family="'Plus Jakarta Sans',sans-serif" font-size="22" font-weight="700" fill="#121211">Hello, World.</text>

  <!-- Japanese (rendered as text, Unicode) -->
  <text x="32" y="220" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" fill="#BD3A1B" letter-spacing="2">JA</text>
  <text x="60" y="222" font-size="22" font-weight="400" fill="#3A3732">こんにちは世界</text>

  <!-- Arabic (RTL displayed as LTR label) -->
  <text x="32" y="256" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" fill="#BD3A1B" letter-spacing="2">AR</text>
  <text x="60" y="258" font-size="22" fill="#3A3732">مرحباً بالعالم</text>

  <!-- Nepali (Devanagari) -->
  <text x="32" y="292" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" fill="#BD3A1B" letter-spacing="2">NE</text>
  <text x="60" y="294" font-size="20" fill="#3A3732">नमस्ते संसार</text>

  <!-- Spanish -->
  <text x="32" y="324" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" fill="#BD3A1B" letter-spacing="2">ES</text>
  <text x="60" y="324" font-family="'Plus Jakarta Sans',sans-serif" font-size="22" font-weight="600" fill="#3A3732">Hola, Mundo.</text>

  <!-- Divider dot row -->
  <circle cx="32" cy="356" r="3" fill="#BD3A1B"/>
  <circle cx="46" cy="356" r="2" fill="#DCD6C9"/>
  <circle cx="57" cy="356" r="2" fill="#DCD6C9"/>
  <text x="70" y="360" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1.5">100+ LANGUAGES SUPPORTED</text>

  <!-- Right panel: Font swatches -->
  <text x="504" y="100" font-family="'JetBrains Mono',monospace" font-size="9" fill="#BD3A1B" letter-spacing="2">TYPEFACE SYSTEM</text>

  <!-- Swatch 1: Jakarta -->
  <text x="504" y="138" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="28" fill="#121211">Jakarta</text>
  <rect x="504" y="144" width="48" height="2" fill="#BD3A1B"/>
  <text x="504" y="157" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1">PLUS JAKARTA SANS</text>

  <!-- Swatch 2: DM Sans -->
  <text x="504" y="192" font-family="'DM Sans',sans-serif" font-weight="700" font-size="26" fill="#3A3732">DM Sans</text>
  <text x="504" y="208" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1">DM SANS</text>

  <!-- Swatch 3: Lora -->
  <text x="504" y="242" font-family="Georgia,serif" font-style="italic" font-size="26" fill="#3A3732">Lora Serif</text>
  <text x="504" y="258" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1">LORA SERIF</text>

  <!-- Swatch 4: Space Grotesk -->
  <text x="504" y="291" font-family="system-ui,sans-serif" font-weight="600" font-size="24" fill="#3A3732">Space Grot.</text>
  <text x="504" y="307" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1">SPACE GROTESK</text>

  <!-- Swatch 5: Mono -->
  <text x="504" y="337" font-family="'Courier New',monospace" font-size="23" fill="#3A3732">0123 Mono</text>
  <text x="504" y="352" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9B9490" letter-spacing="1">JETBRAINS MONO</text>

  <!-- Bottom stat bar -->
  <rect x="0" y="420" width="800" height="80" fill="#121211"/>

  <text x="32" y="455" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6B6560" letter-spacing="2">STACK</text>
  <text x="32" y="472" font-family="'JetBrains Mono',monospace" font-size="11" fill="#F7F5F0" letter-spacing="0.5">Vanilla JS · CSS Custom Properties · localStorage</text>

  <text x="500" y="455" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6B6560" letter-spacing="2">COST</text>
  <text x="500" y="472" font-family="'JetBrains Mono',monospace" font-size="11" fill="#BD3A1B" letter-spacing="0.5">Zero API Keys. Zero Cost.</text>

  <!-- Accent detail line -->
  <rect x="0" y="416" width="800" height="4" fill="#BD3A1B"/>
</svg>
