  <style id="gpa-main-inline">/* ==========================================================================
   Shisir Acharya Portfolio — Main Stylesheet
   Minimalist, Editorial, Swiss Graphic Design System
   ========================================================================== */

:root {
  /* Editorial Warm Linen / Off-White Theme (Default) */
  --bg-primary: #F7F5F0;
  --bg-secondary: #EFECE4;
  --bg-tertiary: #E5E0D5;
  --surface-card: #FFFFFF;
  --surface-elevated: #FAF8F4;

  --text-primary: #121211;
  --text-secondary: #524F48;
  --text-muted: #7E796F;
  --text-light: #A8A295;

  --border-subtle: #E8E4DA;
  --border-medium: #DCD6C9;
  --border-dark: #121211;

  --accent: #BD3A1B;           /* Deep vermilion / cinnabar accent */
  --accent-hover: #9E2F14;
  --accent-muted: rgba(189, 58, 27, 0.12);
  --accent-tint: #FDF3F0;

  --shadow-subtle: 0 4px 20px -2px rgba(18, 18, 17, 0.05);
  --shadow-medium: 0 12px 32px -4px rgba(18, 18, 17, 0.08);
  --shadow-high: 0 24px 48px -8px rgba(18, 18, 17, 0.14);

  /* Spacing Scale */
  --space-2xs: 0.25rem;
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1.25rem;
  --space-lg: 2rem;
  --space-xl: 3.5rem;
  --space-2xl: 5.5rem;
  --space-3xl: 8.5rem;

  /* Layout */
  --container-max: 1340px;
  --container-padding: clamp(1.25rem, 3.5vw, 3rem);

  /* Transitions */
  --transition-fast: 160ms cubic-bezier(0.2, 0, 0, 1);
  --transition-normal: 260ms cubic-bezier(0.2, 0, 0, 1);
  --transition-smooth: 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* Dark Mode Theme (Obsidian & Warm Charcoal) */
[data-theme="dark"] {
  --bg-primary: #10100F;
  --bg-secondary: #171715;
  --bg-tertiary: #20201D;
  --surface-card: #191917;
  --surface-elevated: #21211E;

  --text-primary: #F5F3EC;
  --text-secondary: #B8B3A8;
  --text-muted: #7E796F;
  --text-light: #524E46;

  --border-subtle: #242421;
  --border-medium: #33332D;
  --border-dark: #F5F3EC;

  --accent: #E04E2C;
  --accent-hover: #F06543;
  --accent-muted: rgba(224, 78, 44, 0.16);
  --accent-tint: #231613;

  --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
  --shadow-medium: 0 12px 32px -4px rgba(0, 0, 0, 0.55);
  --shadow-high: 0 24px 48px -8px rgba(0, 0, 0, 0.7);
}

/* CSS Reset & Foundation */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  background-color: var(--bg-primary);
  color-scheme: light;
}

/* Keep native form controls (language/font selects, color pickers, scrollbars)
   aligned with the active editorial theme */
[data-theme="dark"] {
  color-scheme: dark;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background-color var(--transition-smooth), color var(--transition-smooth);
}

img, svg, video {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color var(--transition-fast), border-color var(--transition-fast);
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

ul, ol {
  list-style: none;
}

/* Container */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
  padding-left: var(--container-padding);
  padding-right: var(--container-padding);
}

/* Section Spacing */
.section {
  padding-top: var(--space-2xl);
  padding-bottom: var(--space-2xl);
  position: relative;
}

.section--hero {
  padding-top: clamp(7.5rem, 12vw, 10.5rem);
  padding-bottom: var(--space-2xl);
  min-height: 92vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Editorial Separator Line */
.editorial-rule {
  width: 100%;
  height: 1px;
  background-color: var(--border-subtle);
  border: none;
  margin: 0;
}

.editorial-rule--dark {
  background-color: var(--border-dark);
}

/* Section Header Structure */
.section-header {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  margin-bottom: var(--space-xl);
}

.section-header__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: var(--space-xs);
  border-bottom: 1px solid var(--border-subtle);
}

.section-header__index {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--accent);
  letter-spacing: var(--ls-mono);
  font-weight: 600;
}

.section-header__category {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-muted);
  letter-spacing: var(--ls-tag);
  text-transform: uppercase;
}

.section-header__title {
  font-size: var(--text-2xl);
  font-weight: 700;
  letter-spacing: var(--ls-tight);
}

.section-header__subtitle {
  font-size: var(--text-md);
  color: var(--text-secondary);
  max-width: 64ch;
  line-height: var(--lh-normal);
}

/* Buttons & Links */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  padding: 0.85rem 1.6rem;
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: 2px;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  cursor: pointer;
}

.btn--primary {
  background-color: var(--text-primary);
  color: var(--bg-primary);
  border: 1px solid var(--text-primary);
}

.btn--primary:hover {
  background-color: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
  transform: translateY(-1px);
}

.btn--outline {
  background-color: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border-medium);
}

.btn--outline:hover {
  border-color: var(--text-primary);
  background-color: var(--bg-secondary);
}

.btn--editorial {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  padding: 0.5rem 1rem;
  border: 1px solid var(--border-subtle);
  background: transparent;
}

.btn--editorial:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Text Links with Editorial Underlines */
.editorial-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 600;
  color: var(--text-primary);
  border-bottom: 1.5px solid var(--border-dark);
  padding-bottom: 2px;
}

.editorial-link:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.editorial-link svg {
  transition: transform var(--transition-fast);
}

.editorial-link:hover svg {
  transform: translateX(4px);
}

/* Custom Minimalist Cursor (Desktop only) */
.custom-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 10px;
  height: 10px;
  background-color: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
  mix-blend-mode: difference;
  display: none;
}

.custom-cursor-follower {
  position: fixed;
  top: 0;
  left: 0;
  width: 32px;
  height: 32px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: transform 0.28s ease-out, width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
  display: none;
}

@media (hover: hover) and (pointer: fine) {
  .custom-cursor,
  .custom-cursor-follower {
    display: block;
  }
}

.cursor-hover {
  width: 48px;
  height: 48px;
  background-color: rgba(189, 58, 27, 0.15);
  border-color: var(--accent);
}

/* Focus Indicators for Accessibility */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* Reduced Motion Override */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .custom-cursor,
  .custom-cursor-follower {
    display: none !important;
  }
}
</style>

  width: min(500px, 100%);
  gap: 5px;
  margin: 23px auto 0;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg-secondary);
}
.mode-tab {
  flex: 1;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: color .16s ease, background .16s ease, box-shadow .16s ease;
}
.mode-tab:hover { color: var(--text-primary); }
.mode-tab.is-active {
  border-color: var(--accent-muted);
  color: var(--app-accent);
  background: var(--accent-tint);
  box-shadow: var(--shadow-subtle);
}

.elective-picker-section {
  margin-top: 20px;
  padding: 24px 24px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow-subtle);
}
.elective-picker-header {
  margin-bottom: 16px;
}
.elective-picker-title {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 4px;
}
.elective-picker-description {
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 400;
  text-transform: none;
}
.elective-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.elective-checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .16s ease;
  min-height: 44px;
}
.elective-checkbox-label:hover {
  border-color: var(--accent);
  background: var(--accent-tint);
}
.elective-checkbox-label input[type="checkbox"] {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-subtle);
  border-radius: 6px;
  background: var(--bg-primary);
  cursor: pointer;
  transition: all .16s ease;
  flex-shrink: 0;
  position: relative;
}
.elective-checkbox-label input[type="checkbox"]:hover {
  border-color: var(--accent);
}
.elective-checkbox-label input[type="checkbox"]:checked {
  border-color: var(--accent);
  background: var(--accent);
}
.elective-checkbox-label input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 5px;
  height: 10px;
  border: solid var(--text-on-accent, #fff);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.elective-checkbox-label:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-tint);
  color: var(--accent);
}
.elective-checkbox-label .elective-name {
  flex: 1;
}
.elective-checkbox-label .elective-badge {
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-tertiary, var(--bg-primary));
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: .03em;
  font-weight: 600;
}
.elective-checkbox-label:has(input:checked) .elective-badge {
  color: var(--accent);
  background: var(--accent-tint);
}
.subject-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.subject-card {
  position: relative;
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: var(--shadow-subtle);
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.subject-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-medium); }
.subject-card:has(.custom-dropdown.is-open) {
  z-index: 50;
}
.custom-dropdown.is-open {
  z-index: 60;
}
.subject-card.is-excluded {
  opacity: .55;
  pointer-events: none;
  filter: grayscale(.15);
}
.subject-card.is-excluded .subject-heading h2::after {
  content: " — excluded";
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.subject-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; margin-bottom: 18px; }
.subject-heading h2 { overflow: hidden; margin: 0; color: var(--text-primary); font-size: 16px; font-weight: 700; text-overflow: ellipsis; }
.subject-grade {
  display: inline-grid;
  min-width: 42px;
  height: 34px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: var(--bg-primary);
  font: 700 12px var(--mono);
}
.subject-grade.is-ready { border-color: var(--accent-muted); color: var(--success); background: var(--accent-tint); }
.subject-grade.is-ng { border-color: var(--accent-muted); color: var(--danger); background: var(--accent-tint); }
.subject-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.component-field { display: grid; min-width: 0; gap: 8px; }
.component-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.component-label small { color: var(--text-muted); font-size: 11px; font-weight: 500; white-space: nowrap; }
.mark-input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 9px;
  color: var(--text-primary);
  background: var(--bg-primary);
  font: 600 15px var(--mono);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.mark-input:focus { border-color: var(--app-accent); box-shadow: 0 0 0 3px var(--accent-muted); outline: none; }
.mark-input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--accent-muted); }
.mark-input:disabled { cursor: not-allowed; opacity: .5; }
.grade-field-set {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.grade-field { display: grid; min-width: 0; gap: 7px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.grade-field .select-trigger { height: 50px; font-weight: 700; }
.empty-state { grid-column: 1 / -1; margin: 0; padding: 25px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; font-size: 12px; }
.add-subject {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 47px;
  margin-top: 17px;
  border: 1px dashed var(--line-strong);
  border-radius: 11px;
  color: var(--app-accent);
  background: var(--accent-tint);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color .16s ease, background .16s ease;
}
.add-subject:hover { border-color: var(--app-accent); background: var(--accent-muted); }
.add-subject > span:first-child { font-size: 19px; font-weight: 400; }

.result-card {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: min(570px, 100%);
  min-height: 106px;
  margin: 25px auto 0;
  padding: 18px 24px;
  border: 1px solid var(--accent-muted);
  border-radius: 15px;
  background: var(--surface-card);
  box-shadow: var(--shadow-medium);
  backdrop-filter: blur(8px);
}
.result-card > div { display: grid; gap: 6px; }
.result-label { color: var(--muted); font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.result-gpa { color: var(--app-accent); font: 700 clamp(30px, 5vw, 42px)/1 var(--mono); }
.overall-grade strong { color: var(--text-primary); font: 700 30px var(--mono); }
.result-status { width: min(570px, 100%); min-height: 16px; margin: 9px auto 0; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.5; }

.subject-summary-breakdown {
  width: min(570px, 100%);
  margin: 12px auto 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  font-size: 12px;
  text-align: left;
}
.subject-summary-breakdown div {
  margin-top: 4px;
  color: var(--success);
  font-weight: 600;
}
.subject-summary-breakdown div:first-child {
  margin-top: 0;
}

.subject-dialog {
  width: min(600px, calc(100% - 28px));
  max-height: min(84dvh, 760px);
  overflow: auto;
  padding: 21px;
  border: 1px solid var(--line-strong);
  border-radius: 15px;
  color: var(--text-primary);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-high);
}
.subject-dialog::backdrop { background: color-mix(in srgb, var(--bg-primary) 76%, transparent); backdrop-filter: blur(4px); }
.dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
.dialog-header h2 { margin: 0; font-size: 17px; }
.dialog-close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; color: var(--text-soft); background: transparent; font-size: 20px; cursor: pointer; }
.search-field { margin-bottom: 12px; }
.catalogue-results { max-height: 34dvh; overflow-y: auto; border-top: 1px solid var(--line); }
.catalogue-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); color: var(--text-soft); font-size: 14px; }
.catalogue-action, .custom-toggle, .custom-save {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--app-accent);
  background: var(--accent-tint);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.catalogue-action:hover, .custom-toggle:hover { border-color: var(--app-accent); background: var(--accent-muted); }
.custom-toggle { margin-top: 14px; }
.custom-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; margin-top: 13px; padding: 15px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg-secondary); }
.custom-form .field-label:first-child, .inline-error, .custom-save { grid-column: 1 / -1; }
.custom-save { min-height: 40px; color: #FFFFFF; background: var(--app-accent); }
.inline-error { margin: 0; color: var(--danger); font-size: 11px; }

.theme-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  transition: all var(--transition-fast, .16s ease);
}
.theme-toggle-btn:hover { color: var(--text-primary); border-color: var(--border-medium); }

@media (max-width: 720px) {
  .app-shell { width: min(100% - 32px, 600px); padding-top: 17px; }
  .app-header { margin-bottom: 17px; }
  .setup-card { grid-template-columns: 1fr; gap: 12px; padding: 15px; }
  .field-label input, .field-label .select-trigger { height: 48px; }
  .subject-list { grid-template-columns: 1fr; gap: 14px; }
  .subject-card { padding: 18px; }
  .result-card { bottom: 8px; min-height: 88px; padding: 14px 18px; }
}

@media (max-width: 420px) {
  .app-header { flex-wrap: wrap; gap: 12px; }
  .brand { gap: 9px; font-size: 12px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 11px; }
  .brand-mark svg { width: 27px; height: 27px; }
  .header-actions { gap: 5px; }
  .quiet-button { min-height: 44px; padding: 0 12px; font-size: 12px; }
  .mode-tab { min-height: 46px; padding: 0 10px; font-size: 12px; }
  .subject-card { padding: 16px 14px; }
  .grade-field-set { grid-template-columns: 1fr; gap: 9px; }
  .custom-form { grid-template-columns: 1fr; }
  .custom-form .field-label:first-child, .inline-error, .custom-save { grid-column: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

        s.src='./js/app.bundle.js';

          var s=document.createElement('script');
